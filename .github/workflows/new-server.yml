name: new_server

on:
  push:
    paths:
      - '.github/workflows/new-server.yml'
      - 'new_server/**'
      - 'new_workers/**'
      - 'package.json'
      - 'package-lock.json'
  pull_request:
    paths:
      - '.github/workflows/new-server.yml'
      - 'new_server/**'
      - 'new_workers/**'
      - 'package.json'
      - 'package-lock.json'

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run backend tests
        run: npm test

      - name: Build worker bundle
        run: npm run new_workers:bundle
